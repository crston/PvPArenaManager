# [System Settings / 시스템 기본 설정]
system:
  # Default language for the plugin (ko, en) / 플러그인 기본 언어 설정
  default_language: "en"
  # Countdown time in seconds before match start / 전투 시작 전 카운트다운 시간 (초)
  countdown_seconds: 5

# [Storage Settings / 저장 방식 설정]
# Choose between YAML, SQLITE, or MYSQL / 데이터 저장 방식 선택
storage:
  type: "YAML"
  mysql:
    host: "localhost"
    port: 3306
    database: "pvp_db"
    username: "root"
    password: "password"

# [Match Time Settings / 모드별 제한 시간 설정]
# Duration for each match type in seconds / 각 대전 모드별 제한 시간 (초 단위)
times:
  ONE_VS_ONE: 300
  TWO_VS_TWO: 600
  THREE_VS_THREE: 900
  FOUR_VS_FOUR: 1200
  DEATHMATCH: 600

# [Event Commands / 이벤트별 실행 명령어]
# Use %player% for player names / %player% 변수를 사용하여 플레이어 지정 가능
commands:
  # Commands executed when the match starts / 전투 시작 시 실행되는 명령어
  start:
    both:
      - "msg %player% &eThe battle is about to begin! Good luck."
      - "msg %player% &e전투가 곧 시작됩니다! 행운을 빕니다."
  # Commands executed when the match ends / 전투 종료 시 실행되는 명령어
  end:
    # Executed only for winners / 승리자에게만 실행
    winner:
      - "give %player% diamond 1"
      - "msg %player% &b&lVictory reward has been granted."
      - "msg %player% &b&l승리 보상이 지급되었습니다."
    # Executed only for losers / 패배자에게만 실행
    loser:
      - "msg %player% &cYou were defeated. Better luck next time."
      - "msg %player% &c패배하였습니다. 더 수련해오세요."
    # Executed for all participants / 모든 참가자에게 실행
    both:
      - "msg %player% &7The battle has ended. Returning to your previous location."
      - "msg %player% &7전투가 종료되어 이전 장소로 이동합니다."